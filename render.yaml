databases:
  - name: plateview-db
    plan: free
    databaseName: plateview
    user: plateview

services:
  - type: web
    name: plateview
    runtime: static
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://plateview-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: plateview-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: sh -c "npm run prisma:migrate && npm run seed && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plateview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://plateview.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HF_TOKEN
        sync: false
