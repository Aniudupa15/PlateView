databases:
  - name: plateview-db
    plan: free
    databaseName: plateview
    user: plateview

services:
  - type: web
    name: plateview
    runtime: static
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://plateview-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: plateview-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: sh -c "npm run prisma:migrate && npm run seed && npm start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plateview-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://plateview.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HF_TOKEN
        sync: false
      # Optional: add tokens from additional free Hugging Face accounts to
      # multiply the daily TRELLIS quota (each account gets its own ~3.5-5
      # min/day budget). The server automatically rotates across whichever
      # of these are actually set -- HF_TOKEN_2 alone works fine, no need to
      # fill every slot. Add via this service's Environment tab; a plain
      # `git push` won't prompt for new sync:false vars on an existing
      # service the way the initial Blueprint apply did.
      - key: HF_TOKEN_2
        sync: false
      - key: HF_TOKEN_3
        sync: false
      - key: HF_TOKEN_4
        sync: false
      - key: HF_TOKEN_5
        sync: false
